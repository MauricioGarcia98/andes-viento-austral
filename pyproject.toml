[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "andes_viento"
version = "1.0.0"
description = "Andes Viento Austral: lakehouse E2E de energía renovable en Databricks con Genie en el centro."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mauricio García" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pyspark==4.0.1",
  "delta-spark==4.0.0",
  "pytest>=8",
  "ruff>=0.6",
  "pyyaml>=6",
]
genie = ["databricks-sdk>=0.60"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
  "integration: corre el pipeline completo landing->gold con Spark local (lento)",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks", "learning", "pipelines", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
