# Databricks App: chat con los 4 Genie Agents usando la Conversation API.
# Free Edition permite 1 App. Después del deploy:  python scripts/deploy_genie.py --grant-app andes-genie-chat
resources:
  apps:
    andes_genie_chat:
      name: andes-genie-chat
      description: Chat de las áreas de Andes Viento Austral con sus Genie Agents
      source_code_path: ../apps/genie_chat
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
